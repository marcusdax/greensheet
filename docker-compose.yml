services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: greensheet
      MYSQL_USER: greensheet
      MYSQL_PASSWORD: greensheet
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-greensheet_root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-greensheet_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ID: ${APP_ID:-local-app}
      APP_SECRET: ${APP_SECRET:-local-dev-secret-change-me}
      DATABASE_URL: mysql://greensheet:greensheet@mysql:3306/greensheet
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
