services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: auctum-ledger-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://auctum:auctum123@mysql:3306/auctum_ledger
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      APP_ID: auctum-ledger
      NODE_ENV: production
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: auctum-ledger-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: auctum_ledger
      MYSQL_USER: auctum
      MYSQL_PASSWORD: auctum123
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  mysql_data:
