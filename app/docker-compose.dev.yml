services:
  proxy:
    build:
      target: dev
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - AI_PROXY_PORT=3001
      - AI_ALLOWED_ORIGINS=http://localhost:5173
    ports:
      - "3001:3001"

  app:
    build:
      target: dev
    volumes:
      - ./:/app
      - /app/node_modules
      - ../localization/02-locale-files:/localization/02-locale-files
    environment:
      - VITE_AI_PROXY_URL=http://localhost:3001
      # Polling is required for reliable file-watching on Windows/Docker Desktop bind mounts.
      - CHOKIDAR_USEPOLLING=true
    ports: !override
      - "5173:5173"
