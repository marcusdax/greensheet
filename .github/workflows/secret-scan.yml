# §12.4 — "Add a CI check that fails the build if a high-entropy string matching
# the provider key formats appears in a diff."
#
# Scoped to the diff, not the tree: scanning history on every push would flag
# the same fixture forever and teach people to skip the job. What it looks for
# is a key SHAPE assigned to a name that means "secret" — a PayOS checksum key
# is 64 hex characters, a Casso API key is a long opaque token, and both look
# like nothing else in this repository.
#
# The test fixtures under api/services/payments/fixtures are excluded. Their
# signatures are the literal string "placeholder" and every identifier in them
# is invented; see the README in that directory.
#
# Everywhere else, a line that legitimately looks like a key — a deterministic
# value in a test harness — is waved through with a trailing
# `pragma: allowlist secret` comment. A per-line marker is reviewable in the
# diff that introduces it; a path exclusion is a hole nobody sees again.
name: Secret scan

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  scan:
    name: provider key formats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the diff for provider key shapes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch reports an all-zero "before"; fall back to the first
          # parent so the job still has something to diff against.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          echo "Diffing $base..HEAD"
          added="$(mktemp)"
          git diff --unified=0 "$base" HEAD -- \
            ':!app/api/services/payments/fixtures/**' \
            ':!**/package-lock.json' \
            | grep -E '^\+' | grep -Ev '^\+\+\+' > "$added" || true

          if [ ! -s "$added" ]; then
            echo "No added lines to scan."
            exit 0
          fi

          # Each pattern is a NAME that means secret, followed by a VALUE long
          # enough to be one. Matching on shape alone would flag every commit
          # hash in a comment; matching on the name alone would flag every line
          # that reads a key from the environment.
          patterns=(
            '(PAYOS_CHECKSUM_KEY|PAYOS_API_KEY|CASSO_API_KEY|CASSO_WEBHOOK_SECRET|MOMO_SECRET_KEY|ZALOPAY_KEY[12]|EINVOICE_API_KEY|WEBHOOK_SECRET|APP_SECRET)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9._/+-]{24,}'
            '(checksum_?key|api_?key|secret_?key|access_?key)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"'][A-Fa-f0-9]{48,}["'"'"']'
          )

          # A dot is in the value class because a Casso key really does look
          # like AK_CS.6f2a…, which means `process.env.PAYOS_API_KEY` now
          # matches the shape too. Those are REFERENCES to a secret, which is
          # what correct code looks like, so they are filtered here rather than
          # narrowed out of the pattern — narrowing would have let the real
          # Casso format through.
          benign='pragma: allowlist secret|process\.env|import\.meta\.env|\$\{|\$[A-Z_]{3,}'

          failed=0
          for pattern in "${patterns[@]}"; do
            if matches="$(grep -EIn "$pattern" "$added" | grep -Ev "$benign")"; then
              echo "::error::A provider key shape appears in this diff."
              echo "$matches"
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Provider secrets come from the secret manager (§12.4), never from a committed file."
            echo "If this is a test fixture, put it under app/api/services/payments/fixtures/,"
            echo "or mark the line with a trailing 'pragma: allowlist secret' comment."
            exit 1
          fi

          echo "No provider key shapes in the diff."
