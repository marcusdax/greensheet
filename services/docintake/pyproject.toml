[project]
name = "docintake"
version = "0.1.0"
description = "Auctum Ledger document intake — extracts structured lot-offer and CMR shipping fields from document photos via the Claude API. Adapted from the vision-ocr-ai-agent-logistics concept."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "anthropic>=1.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
